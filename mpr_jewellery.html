    // State Container
    const state = {

      ownerAuth: JSON.parse(localStorage.getItem('mpr_owner_auth_v5')) || {

      store: JSON.parse(localStorage.getItem('mpr_store_v5')) || {
        name: "MPR JEWELLERY",

      orders: JSON.parse(localStorage.getItem('mpr_orders_v5')) || [
        {
          id: "MPR-984210",
          customer: "Priya Sharma",
          phone: "9876501234",
          address: "Flat 402, Royal Palms, MG Road, Bengaluru",
          totalINR: 45000,
          utr: "429182749102",
          paymentStatus: "Pending Verification",
          orderStatus: "Confirmed",
          date: "Today, 10:45 AM"
        }
      ],

      messages: JSON.parse(localStorage.getItem('mpr_messages_v5')) || []
    };

    function saveState() {
      localStorage.setItem('mpr_owner_auth_v5', JSON.stringify(state.ownerAuth));
      localStorage.setItem('mpr_store_v5', JSON.stringify(state.store));
      localStorage.setItem('mpr_rates_v5', JSON.stringify(state.rates));
      localStorage.setItem('mpr_upi_v5', JSON.stringify(state.upi));
      localStorage.setItem('mpr_products_v5', JSON.stringify(state.products));
      localStorage.setItem('mpr_cart_v5', JSON.stringify(state.cart));
      localStorage.setItem('mpr_orders_v5', JSON.stringify(state.orders));
      localStorage.setItem('mpr_messages_v5', JSON.stringify(state.messages));
    }

    function formatCur(inrAmount) {
      const conf = CURRENCIES[state.currency] || CURRENCIES.INR;
      if (state.currency === 'INR') {
        return `₹${inrAmount.toLocaleString('en-IN')}`;
      }
      const val = (inrAmount / conf.rate).toFixed(2);
      return `${conf.symbol}${Number(val).toLocaleString()}`;
    }

    // --- 2. RENDER ENGINE ---
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (state.page === 'owner-login') {
        app.innerHTML = renderOwnerLogin();
      } else if (state.page === 'owner-portal') {
        app.innerHTML = renderOwnerPortal();
      } else if (state.page === 'detail') {
        app.innerHTML = renderFullPageDetail();
      } else if (state.page === 'checkout') {
        app.innerHTML = renderFullPageCheckout();
      } else if (state.page === 'auth') {
        app.innerHTML = renderCustomerAuth();
      } else if (state.page === 'about') {
        app.innerHTML = renderAboutPage();
      } else if (state.page === 'contact') {
        app.innerHTML = renderContactPage();
      } else {
        app.innerHTML = renderHomePage();
      }
    }

    // --- 3. HOMEPAGE VIEW ---
    function renderHomePage() {
      const filtered = state.products.filter(p => {
        const matchCat = state.selectedCategory === 'All' || p.category.toLowerCase() === state.selectedCategory.toLowerCase() || p.metal.toLowerCase() === state.selectedCategory.toLowerCase();
        const matchSearch = p.name.toLowerCase().includes(state.searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      const cartCount = state.cart.reduce((sum, item) => sum + item.qty, 0);

      return `
        <!-- Top Rate Bar -->
        <div class="bg-mpr-darkWine text-white text-[11px] sm:text-xs py-2 px-3 sm:px-4 border-b border-mpr-gold/30">
          <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2 sm:gap-4 text-mpr-goldLight font-medium overflow-x-auto whitespace-nowrap scrollbar-none">
              <span>🪙 Gold Rate <b class="text-white">₹${state.rates.gold22k.toLocaleString('en-IN')}/10g</b></span>
              <span>|</span>
              <span>🥈 Silver Rate <b class="text-white">₹${state.rates.silver1g}/1g</b></span>
              <span class="hidden md:inline">|</span>
              <span class="hidden md:inline">💎 Diamond Rate <b class="text-white">₹${state.rates.diamond1ct.toLocaleString('en-IN')}/ct</b></span>
            </div>
            <div class="flex items-center gap-3">
              <span class="hidden lg:inline text-emerald-300">🚚 Free Shipping Above ₹${state.upi.freeShipINR.toLocaleString('en-IN')}</span>
              
              <!-- Currency Selector -->
              <div class="flex items-center gap-1 bg-white/10 px-2 py-0.5 rounded border border-mpr-gold/40">
                <span class="text-[10px] text-mpr-goldLight">Currency:</span>
                <select onchange="setCurrency(this.value)" class="bg-transparent text-white font-bold text-[10px] focus:outline-none cursor-pointer">
                  ${Object.keys(CURRENCIES).map(c => `
                    <option value="${c}" ${state.currency === c ? 'selected' : ''} class="bg-mpr-darkWine text-white">
                      ${CURRENCIES[c].name}
                    </option>
                  `).join('')}
                </select>
              </div>

              <button onclick="goToPage('auth')" class="hover:text-mpr-gold">Login / Sign Up</button>
              <button onclick="toggleCart(true)" class="flex items-center gap-1 bg-mpr-burgundy px-2 py-0.5 rounded border border-mpr-gold/40">
                <span>🛍️</span> <span class="bg-mpr-gold text-mpr-darkWine text-[10px] font-bold px-1.5 rounded-full">${cartCount}</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Sticky Header with Editable Store Name & Tagline -->
        <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-mpr-gold/20">
          <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div onclick="goToPage('home')" class="flex items-center gap-2.5 cursor-pointer">
              <div class="w-10 h-10 rounded-full bg-mpr-burgundy text-mpr-gold border border-mpr-gold flex items-center justify-center text-lg shadow">👑</div>
              <div>
                <h1 class="font-serif tracking-widest text-2xl font-bold text-mpr-burgundy leading-none">${state.store.name}</h1>
                <p class="text-[9px] tracking-widest font-semibold text-mpr-gold uppercase">Jewellery</p>
                <span class="text-[8px] text-gray-400 block -mt-0.5 font-serif italic">${state.store.tagline}</span>
              </div>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden lg:flex items-center gap-6 text-sm font-medium">

              <button onclick="filterCategory('Diamond')" class="hover:text-mpr-burgundy ${state.selectedCategory==='Diamond'?'text-mpr-burgundy font-bold':''}">Diamond</button>
              <button onclick="filterCategory('All')" class="hover:text-mpr-burgundy">Collections</button>
              <button onclick="goToPage('about')" class="hover:text-mpr-burgundy">About Us</button>
              <button onclick="goToPage('contact')" class="hover:text-mpr-burgundy">Contact</button>
            </nav>

            <!-- Search Bar -->
            <div class="relative hidden md:block w-56">
              <input type="text" placeholder="Search jewellery..." value="${state.searchQuery}" oninput="search(this.value)" class="w-full bg-mpr-champagne/60 border border-gray-300 rounded-full py-1.5 pl-4 pr-8 text-xs focus:outline-none focus:border-mpr-gold" />

            </div>

                </button>

            <div class="space-y-3 text-center md:text-left">
              <span class="text-xs text-mpr-goldLight font-bold uppercase tracking-widest block">WELCOME TO ${state.store.name}</span>
              <h2 class="text-3xl sm:text-5xl font-serif font-bold leading-tight">Crafted with Love <br><span class="text-mpr-goldLight italic">Shine for a Lifetime</span></h2>

            </div>
            <div class="flex justify-center">
              <div class="relative w-full max-w-sm sm:max-w-md h-64 sm:h-72 rounded-2xl overflow-hidden border-2 border-mpr-gold/40 shadow-2xl">
                <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover" />
                <div class="absolute inset-0 bg-gradient-to-t from-mpr-darkWine/80 via-transparent to-transparent"></div>
                <div class="absolute bottom-3 left-4 text-xs text-mpr-goldLight font-bold">Bridal Heritage Collection 2026</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 3 Rate Summary Cards -->
        <div class="bg-mpr-champagne py-4 px-4 border-b border-mpr-gold/20">
          <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap gap-3">
              <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-mpr-gold/40 flex items-center gap-3">
                <span class="text-xl">🪙</span>
                <div>
                  <span class="text-[9px] text-gray-500 font-bold block uppercase">Gold 22K</span>

              </div>
            `).join('')}

        <div id="best-sellers" class="max-w-7xl mx-auto px-4 py-6 flex-1">

            <h3 class="font-serif text-2xl font-bold text-mpr-burgundy mt-1">Our Best Sellers</h3>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            ${filtered.map(p => `
              <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">

                    <span class="bg-mpr-champagne px-1.5 py-0.5 rounded text-mpr-burgundy font-bold">${p.purity}</span>
                    <span>⭐ ${p.rating}</span>
                  </div>
                  <h4 onclick="openDetail('${p.id}')" class="font-serif font-bold text-xs sm:text-sm text-gray-800 hover:text-mpr-burgundy cursor-pointer truncate">${p.name}</h4>
                  <div class="flex items-baseline gap-2">
                    <b class="text-mpr-burgundy text-sm sm:text-base">${formatCur(p.priceINR)}</b>
                    <span class="text-gray-400 text-xs line-through">${formatCur(p.origPriceINR)}</span>
                  </div>
                  <div class="pt-2 space-y-1.5 border-t border-gray-100">
                    <button onclick="buyNowDirect('${p.id}', 1)" class="w-full bg-mpr-burgundy hover:bg-mpr-wine text-white text-xs font-bold py-2 rounded-xl transition shadow-sm">

      if (state.ownerTab === 'store_info') {
        return `
          <div class="bg-white p-6 sm:p-8 rounded-3xl border shadow-sm max-w-lg space-y-4 text-xs">
            <h3 class="font-serif font-bold text-2xl text-mpr-burgundy">Change Website Name & Contact Info</h3>
            <div>
              <label class="font-bold block mb-1">Website / Brand Name</label>
              <input type="text" id="edit-store-name" value="${state.store.name}" class="w-full p-2.5 rounded-xl border font-bold" />
            </div>
            <div>
              <label class="font-bold block mb-1">Tagline</label>
              <input type="text" id="edit-store-tagline" value="${state.store.tagline}" class="w-full p-2.5 rounded-xl border" />
            </div>
            <div>
              <label class="font-bold block mb-1">Store Phone Number</label>
              <input type="text" id="edit-store-phone" value="${state.store.phone}" class="w-full p-2.5 rounded-xl border" />
            </div>
            <div>
              <label class="font-bold block mb-1">Support Email</label>
              <input type="email" id="edit-store-email" value="${state.store.email}" class="w-full p-2.5 rounded-xl border" />
            </div>
            <div>
              <label class="font-bold block mb-1">Store Address</label>
              <textarea id="edit-store-addr" rows="2" class="w-full p-2.5 rounded-xl border">${state.store.address}</textarea>
            </div>
            <button onclick="saveStoreInfo()" class="w-full bg-mpr-burgundy text-white font-bold py-3 rounded-xl shadow">
              Save Store Info
            </button>
          </div>
        `;
      }

      if (state.ownerTab === 'rates') {
        return `
          <div class="bg-white p-6 sm:p-8 rounded-3xl border shadow-sm max-w-md space-y-4 text-xs">
            <h3 class="font-serif font-bold text-2xl text-mpr-burgundy">Live Metal Rates Manager</h3>
            <div>
              <label class="font-bold block mb-1">Gold 22K (per 10g in ₹)</label>
              <input type="number" id="edit-gold22" value="${state.rates.gold22k}" class="w-full p-2.5 rounded-xl border font-bold" />
            </div>
            <div>
              <label class="font-bold block mb-1">Silver (per 1g in ₹)</label>
              <input type="number" id="edit-silver1" value="${state.rates.silver1g}" class="w-full p-2.5 rounded-xl border font-bold" />
            </div>
            <div>
              <label class="font-bold block mb-1">Diamond (per Carat in ₹)</label>
              <input type="number" id="edit-diamond1" value="${state.rates.diamond1ct}" class="w-full p-2.5 rounded-xl border font-bold" />
            </div>
            <button onclick="saveRates()" class="w-full bg-mpr-burgundy text-white font-bold py-3 rounded-xl shadow">
              Publish Rates to Website
            </button>
          </div>
        `;
      }

      if (state.ownerTab === 'settings') {
        return `
          <div class="bg-white p-6 sm:p-8 rounded-3xl border shadow-sm max-w-md space-y-4 text-xs">
            <h3 class="font-serif font-bold text-2xl text-mpr-burgundy">UPI & QR Code Settings</h3>
            <div>
              <label class="font-bold block mb-1">Store UPI ID / VPA</label>
              <input type="text" id="edit-upi-id" value="${state.upi.id}" class="w-full p-2.5 rounded-xl border font-bold text-mpr-burgundy" />
            </div>
            <div>
              <label class="font-bold block mb-1">Free Shipping Above (INR ₹)</label>
              <input type="number" id="edit-upi-freeship" value="${state.upi.freeShipINR}" class="w-full p-2.5 rounded-xl border" />
            </div>
            <button onclick="saveUpi()" class="w-full bg-mpr-burgundy text-white font-bold py-3 rounded-xl shadow">
              Save UPI Settings
            </button>
          </div>
        `;
      }

      // Default: Dashboard Tab
      return `
        <div class="space-y-6">
          <h3 class="font-serif font-bold text-2xl text-mpr-burgundy">Owner Dashboard Overview</h3>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl border shadow-sm">
              <span class="text-[10px] text-gray-500 uppercase font-bold block">Total Verified Sales</span>
              <b class="text-xl text-mpr-burgundy">₹${state.orders.filter(o=>o.paymentStatus==='Paid').reduce((sum, o)=>sum+o.totalINR, 45000).toLocaleString('en-IN')}</b>
            </div>
            <div class="bg-white p-4 rounded-2xl border shadow-sm">
              <span class="text-[10px] text-gray-500 uppercase font-bold block">Total Orders</span>
              <b class="text-xl text-gray-800">${state.orders.length}</b>
            </div>
            <div class="bg-white p-4 rounded-2xl border shadow-sm">
              <span class="text-[10px] text-gray-500 uppercase font-bold block">Live Ornaments</span>
              <b class="text-xl text-gray-800">${state.products.length}</b>
            </div>
          </div>
        </div>
      `;
    }

    // --- 8. MODALS & SUB-PAGES ---
    function renderGalleryModal() {
      if (!state.galleryModalOpen) return '';
      const p = state.products.find(item => item.id === state.activeProductId) || state.products[0];
      return `
        <div class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4">
          <div class="bg-mpr-darkWine max-w-4xl w-full rounded-3xl p-4 text-white">
            <div class="flex justify-between items-center pb-2 border-b border-mpr-gold/30 mb-3">
              <span class="font-serif text-sm">${p.name} Gallery</span>
              <button onclick="state.galleryModalOpen=false; render();" class="text-2xl">✕</button>
            </div>
            <div class="h-80 flex items-center justify-center bg-black/40 rounded-2xl mb-3 overflow-hidden">
              <img src="${p.images[state.galleryIndex] || p.images[0]}" class="max-h-full max-w-full object-contain" />
            </div>
            <div class="flex gap-2 justify-center">
              ${p.images.map((img, idx) => `
                <img src="${img}" onclick="state.galleryIndex=${idx}; render();" class="w-14 h-14 object-cover rounded-xl border-2 ${state.galleryIndex===idx?'border-mpr-gold':'opacity-60'} cursor-pointer" />
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderCartModal() {
      if (!state.cartOpen) return '';
      const subtotalINR = state.cart.reduce((sum, item) => sum + (item.product.priceINR * item.qty), 0);
      return `
        <div class="fixed inset-0 z-50 bg-black/60 flex justify-end">
          <div class="bg-white w-full max-w-md h-full p-5 flex flex-col justify-between overflow-y-auto">
            <div>
              <div class="flex justify-between items-center border-b pb-3 mb-3">
                <b class="font-serif text-mpr-burgundy">Shopping Cart (${state.cart.length})</b>
                <button onclick="toggleCart(false)" class="text-lg">✕</button>
              </div>
              <div class="space-y-3">
                ${state.cart.map((item, idx) => `
                  <div class="flex gap-3 bg-mpr-champagne/40 p-2.5 rounded-xl border text-xs">
                    <img src="${item.product.images[0]}" class="w-14 h-14 object-cover rounded-lg" />
                    <div class="flex-1">
                      <b class="block truncate">${item.product.name}</b>
                      <span class="text-mpr-burgundy font-bold">${formatCur(item.product.priceINR * item.qty)}</span>
                      <div class="flex items-center gap-2 mt-1">
                        <button onclick="updateCartQty(${idx}, -1)" class="w-5 h-5 bg-gray-200 font-bold rounded">-</button>
                        <span>${item.qty}</span>
                        <button onclick="updateCartQty(${idx}, 1)" class="w-5 h-5 bg-gray-200 font-bold rounded">+</button>
                        <button onclick="removeCartItem(${idx})" class="text-rose-500 ml-auto">Remove</button>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="border-t pt-3 space-y-2 text-xs">
              <div class="flex justify-between"><span>Subtotal:</span><b>${formatCur(subtotalINR)}</b></div>
              <button onclick="toggleCart(false); goToPage('checkout');" class="w-full bg-mpr-burgundy text-white font-bold py-3 rounded-xl shadow">
                Proceed to Checkout →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderCustomerAuth() {
      return `
        <div class="min-h-screen bg-mpr-champagne/40 p-4 flex flex-col justify-between">
          <div class="max-w-md w-full mx-auto my-auto bg-white p-6 sm:p-8 rounded-3xl shadow-xl border">
            <button onclick="goToPage('home')" class="text-xs text-mpr-burgundy font-bold mb-3 block">← Back to Store</button>
            <h3 class="font-serif font-bold text-2xl text-mpr-burgundy">Sign In to ${state.store.name}</h3>
            <div class="space-y-3 text-xs mt-4">
              <div><label class="font-bold block mb-1">Email or Mobile</label><input type="text" class="w-full p-2.5 rounded-xl border" /></div>
              <div><label class="font-bold block mb-1">Password</label><input type="password" class="w-full p-2.5 rounded-xl border" /></div>
              <button onclick="alert('Signed in!'); goToPage('home');" class="w-full bg-mpr-burgundy text-white font-bold py-3 rounded-xl shadow mt-2">Sign In</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderAboutPage() {
      return `
        <div class="min-h-screen bg-white">
          <div class="bg-mpr-darkWine text-white p-8 text-center">
            <button onclick="goToPage('home')" class="text-xs underline mb-2 block mx-auto text-mpr-goldLight">← Back to Store</button>
            <h2 class="font-serif text-3xl font-bold">${state.store.name}</h2>
            <p class="text-xs text-mpr-goldLight mt-1">${state.store.tagline}</p>
          </div>
          <div class="max-w-3xl mx-auto p-6 sm:p-12 text-sm text-gray-700 leading-relaxed space-y-4">
            <h3 class="font-serif text-2xl font-bold text-mpr-burgundy">Royal Heritage Since 1988</h3>
            <p>Every ornament is handcrafted with 100% pure hallmarked gold, silver, and certified diamonds.</p>
            <button onclick="goToPage('home')" class="bg-mpr-burgundy text-white font-bold px-6 py-2.5 rounded-xl text-xs">Explore Catalogue →</button>
          </div>
        </div>
      `;
    }

    function renderContactPage() {
      return `
        <div class="min-h-screen bg-mpr-champagne/40 p-4 sm:p-8">
          <div class="max-w-xl mx-auto bg-white p-6 sm:p-8 rounded-3xl shadow-xl border">
            <button onclick="goToPage('home')" class="text-xs text-mpr-burgundy font-bold mb-3 block">← Back to Store</button>
            <h3 class="font-serif font-bold text-2xl text-mpr-burgundy">Contact ${state.store.name}</h3>
            <div class="text-xs text-gray-500 mb-4 space-y-0.5">
              <div>📍 ${state.store.address}</div>
              <div>📞 ${state.store.phone} | ✉️ ${state.store.email}</div>
            </div>
            <form onsubmit="alert('Message sent to Owner!'); goToPage('home');" class="space-y-3 text-xs">
              <div><label class="font-bold block mb-1">Your Name</label><input type="text" required class="w-full p-2.5 rounded-xl border" /></div>
              <div><label class="font-bold block mb-1">Message</label><textarea required rows="3" class="w-full p-2.5 rounded-xl border"></textarea></div>
              <button type="submit" class="bg-mpr-burgundy text-white font-bold px-6 py-2.5 rounded-xl">Send Inquiry</button>
            </form>
          </div>
        </div>
      `;
    }

    // --- 9. ACTION HANDLERS ---
    window.goToPage = function(page) {
      state.page = page;
      state.dropdownOpen = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    };

    window.filterCategory = function(cat) {
      state.selectedCategory = cat;
      state.page = 'home';
      state.dropdownOpen = false;
      render();
    };

    window.search = function(val) {
      state.searchQuery = val;
      render();
    };

    window.setCurrency = function(c) {
      state.currency = c;
      render();
    };

    window.toggleDropdown = function() {
      state.dropdownOpen = !state.dropdownOpen;
      render();
    };

    window.toggleCart = function(isOpen) {
      state.cartOpen = isOpen;
      render();
    };

    window.openDetail = function(id) {
      state.activeProductId = id;
      state.detailQuantity = 1;
      state.page = 'detail';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    };

    window.changeQty = function(delta) {
      state.detailQuantity = Math.max(1, state.detailQuantity + delta);
      render();
    };

    window.toggleAccordion = function(acc) {
      state.openAccordion = state.openAccordion === acc ? '' : acc;
      render();
    };

    window.openGallery = function(prodId, idx) {
      state.activeProductId = prodId;
      state.galleryIndex = idx;
      state.galleryModalOpen = true;
      render();
    };

    window.addToCartItem = function(id, qty) {
      const p = state.products.find(item => item.id === id);
      if (!p) return;
      const exist = state.cart.find(c => c.product.id === id);
      if (exist) exist.qty += qty;
      else state.cart.push({ product: p, qty });
      saveState();
      alert(`Added ${qty} item(s) to Cart!`);
      render();
    };

    window.buyNowDirect = function(id, qty) {
      const p = state.products.find(item => item.id === id);
      if (!p) return;
      state.cart = [{ product: p, qty }];
      saveState();
      goToPage('checkout');
    };

    window.updateCartQty = function(idx, delta) {
      if (state.cart[idx]) {
        state.cart[idx].qty = Math.max(1, state.cart[idx].qty + delta);
        saveState();
        render();
      }
    };

    window.removeCartItem = function(idx) {
      state.cart.splice(idx, 1);
      saveState();
      render();
    };

    window.confirmOrder = function(totalINR) {
      const utr = document.getElementById('checkout-utr')?.value;
      if (!utr || utr.length < 6) {
        alert('Please enter your 12-digit UPI UTR Number from your payment app.');
        return;
      }
      const order = {
        id: "MPR-" + Math.floor(100000 + Math.random() * 900000),
        customer: "Customer",
        totalINR,
        utr,
        paymentStatus: "Pending Verification",
        orderStatus: "Confirmed",
        date: "Just Now"
      };
      state.orders.unshift(order);
      state.cart = [];
      saveState();
      alert(`Order Placed Successfully!\nOrder ID: ${order.id}\nThe owner will verify the transaction.`);
      goToPage('home');
    };

    // 🌟 SECURE LOGIN VALIDATION WITHOUT EXPOSING CREDENTIALS 🌟
    window.handleOwnerLoginSubmit = function(e) {
      e.preventDefault();
      const email = document.getElementById('owner-email-input')?.value.trim();
      const pass = document.getElementById('owner-pass-input')?.value.trim();
      
      if (email.toLowerCase() === state.ownerAuth.email.toLowerCase() && pass === state.ownerAuth.password) {
        state.ownerLoggedIn = true;
        goToPage('owner-portal');
      } else {
        alert('Invalid email or password. Please verify your credentials and try again.');
      }
    };

    window.setOwnerTab = function(t) {
      state.ownerTab = t;
      render();
    };

    window.deleteProduct = function(id) {
      state.products = state.products.filter(p => p.id !== id);
      saveState();
      render();
    };

    window.handleProductAdd = function(e) {
      e.preventDefault();
      const fileInput = document.getElementById('prod-file-input');
      const name = document.getElementById('add-prod-name')?.value;
      const cat = document.getElementById('add-prod-cat')?.value;
      const metal = document.getElementById('add-prod-metal')?.value;
      const price = Number(document.getElementById('add-prod-price')?.value);
      const purity = document.getElementById('add-prod-purity')?.value;

      const finishAdd = (imgSrc) => {
        const newP = {
          id: "prod-" + Date.now(),
          name,
          category: cat,
          metal,
          purity,
          weight: 20,
          priceINR: price,
          origPriceINR: Math.round(price * 1.15),
          discount: 13,
          rating: 5.0,
          reviews: 1,
          images: [imgSrc],
          description: "Exclusive jewellery crafted from pure hallmark metal.",
          stock: 10
        };
        state.products.unshift(newP);
        saveState();
        alert(`Ornament "${name}" uploaded from gallery and saved in store!`);
        state.ownerTab = 'products';
        render();
      };

      if (fileInput?.files[0]) {
        const reader = new FileReader();
        reader.onloadend = () => finishAdd(reader.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishAdd("https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=1000&auto=format&fit=crop");
      }
    };

    window.saveStoreInfo = function() {
      state.store.name = document.getElementById('edit-store-name').value;
      state.store.tagline = document.getElementById('edit-store-tagline').value;
      state.store.phone = document.getElementById('edit-store-phone').value;
      state.store.email = document.getElementById('edit-store-email').value;
      state.store.address = document.getElementById('edit-store-addr').value;
      saveState();
      alert('Store info updated live across the website!');
      render();
    };

    window.saveOwnerAuth = function() {
      const email = document.getElementById('edit-owner-email').value.trim();
      const pass = document.getElementById('edit-owner-pass').value.trim();
      if (!email || !pass) {
        alert('Email and password cannot be empty!');
        return;
      }
      state.ownerAuth.email = email;
      state.ownerAuth.password = pass;
      saveState();
      alert('Owner credentials updated successfully! Use your new credentials next time you log in.');
      render();
    };

    window.saveRates = function() {
      state.rates.gold22k = Number(document.getElementById('edit-gold22').value);
      state.rates.silver1g = Number(document.getElementById('edit-silver1').value);
      state.rates.diamond1ct = Number(document.getElementById('edit-diamond1').value);
      saveState();
      alert('Rates published to client store!');
      render();
    };

    window.saveUpi = function() {
      state.upi.id = document.getElementById('edit-upi-id').value;
      state.upi.freeShipINR = Number(document.getElementById('edit-upi-freeship').value);
      saveState();
      alert('UPI settings saved!');
      render();
    };

    // Initial render on boot
    window.addEventListener('DOMContentLoaded', render);
    render();
  </script>
</body>
</html>
